business_map:
  items:
    - header: 1.基于XX平台和样板业务特点，使能推理引擎X 、推理框架A、 开源框架S生态建设，持续构建样板高性能训推竞争力
      subs:
        - text: 样板稀疏量化：训练FP8、推理FP4低精、混合量化&稀疏算法，提升样板稀疏量化竞争力
        - text: 样板训练：样板训练专家负载均衡路由算法+通信优化，提升样板训练大EP场景竞争力
        - text: 样板推理：emb cache样板理解加速，语音模型推理加速
        - text: 样板FA过载自适应优化：动态调频、FA切分，算子重排
        - lead: 关键挑战：
          text: 量化精度优化评估，XX技术项目快速打通，训推算法开源社区价值兑现，功耗优化XX版本平稳交付落地+客户面支撑
    - header: 2.Agent算子生成，项目630、930关键节点达成，保障Agentic RL训练效果，算子生成关键技术点开发落地
      subs:
        - text: SFT：CoT蒸馏，数据精简，多轮改造数据增强，构建开源高质量训练数据集
        - text: RL：训练算法Reward设计、并行编程语言训练流程优化，profiling feedback注入优化，提升SFT、RL训练效果
        - lead: 关键挑战：
          text: 数据集质量难评估，Agent RL训练不稳定，环境受限情况下大规模训练算法评估和效率提升
    - header: 3.团队建设，结合内转、校招，提升团队竞争力+组织能力
      subs:
        - text: 团队构成：当前15人（自有12人 + OD 1人+实习生1人，访问学者1人），年底达到18+（自有+OD）
        - text: 能力提升：任职提升（5级1人，4级1人，3级4人，2级3人，1级3人）、论文专利发表（H1 2篇，H2规划5篇）
        - text: 技术分享（模型、需求算法）、关键项目交付（推理、训练、部门T）
        - lead: 关键挑战：
          text: "1）新成员能力持续提升\n                 2）SE角色欠缺，需要尽快培养\n                 3）高职级内转员工能力激发"

