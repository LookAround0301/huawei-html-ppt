atmosphere_map:
  sections:
    - title: 团队导向氛围：
      statement: 打造一个敢于突破，勇于创新，团结一致，有技术追求的团队。
      blocks:
        - header: 行动措施
          items:
            - {lead: 关键GAP点：, text: 团队人员缺乏洞察能力，当前很多技术都来做外部团队输入。}
            - text: 规划技术领域责任人，定期去洞察分析新技术。
            - text: 组织小组例会、参与SEG例会，分享、全员学习相关新技术。
            - text: 给予员工与专家、社区、外部会议论坛交流机会，培养员工技术洞察能力。
        - header: 活动氛围
          items:
            - text: 关键节点的团建、聚餐，1~2个月组织一次。
            - text: 根据员工兴趣组织集体活动：健身、打球、露营等等。
